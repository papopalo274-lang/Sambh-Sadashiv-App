name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg \
          autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config ccache \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev zip unzip

        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython<3.0.0"
        python -m pip install "sh>=1.10,<2.0"
        python -m pip install "buildozer==1.5.0"
        python -m pip install "python-for-android==2024.1.21"

    - name: Build APK with Buildozer
      run: |
        rm -rf .buildozer
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sambh-Sadashiv-App
        path: bin/*.apk
